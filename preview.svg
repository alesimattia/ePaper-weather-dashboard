<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Sfondo cornice schermo 960w x 672h (offset 10,14 per margine) -->
  <rect x="10" y="14" width="960" height="672" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- ====== Wallpaper 620w x 300h a (x=0, y=0) ====== -->
  <defs>
    <pattern id="wp" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="36" fill="#d9dde0"/>
      <rect x="18" width="18" height="36" fill="#c8ccd0"/>
    </pattern>
    <!-- Icona busta compressa 20w x 14h visibili (badge mail unread). -->
    <g id="mailIcon">
      <rect x="1" y="3" width="18" height="13" fill="none" stroke="#111" stroke-width="1"/>
      <polyline points="1,3 10,8 19,3" fill="none" stroke="#111" stroke-width="1"/>
    </g>
  </defs>
  <rect x="10" y="14" width="620" height="300" fill="url(#wp)"/>
  <rect x="240" y="150" width="160" height="28" fill="#ffffff" fill-opacity="0.7"/>
  <text x="320" y="169" text-anchor="middle" font-size="14" letter-spacing="2" fill="#555">WALLPAPER 620w × 300h</text>

  <!-- ====== Area mail 620w x 160h @ (x=0, y=300) ======
       Griglia 2 colonne x 2 righe = 4 mail, riempita COLUMN-MAJOR
       (drawMailCell: col = idx / MAIL_ROWS_PER_COL, row = idx % ...): la piu'
       recente in alto a sinistra, si scende nella colonna sinistra e si
       riprende in cima a destra, cosi' la lettura resta cronologica.
       Per cella:
       sx alto: email mittente + (busta inline se UNREAD)
       sx basso: oggetto (FONT_SMALL, ravvicinato)
       dx alto: orario HH:MM    dx basso: data dd/MM
       Spaziatura verticale: TOP_PAD 4 + ROW 63 + GAP 12 + ROW 63 + BOT 18 = 160. -->
  <!-- Separatori dashed delle celle (solo guida visiva, non disegnati su EPD) -->
  <line x1="320" y1="318" x2="320" y2="456" stroke="#bbbbbb" stroke-dasharray="3,3"/>
  <line x1="10" y1="387" x2="630" y2="387" stroke="#bbbbbb" stroke-dasharray="3,3"/>

  <!-- Cella TOP-LEFT (mail piu' recente, UNREAD) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="16" y="337" font-size="17">mario.rossi@example.com</text>
    <use href="#mailIcon" transform="translate(178,323)"/>
    <text x="16" y="354" font-size="13" fill="#333">Riunione domani ore 10, sala B — prepara..</text>
    <text x="310" y="337" font-size="17" text-anchor="end">09:42</text>
    <text x="310" y="354" font-size="17" text-anchor="end">12/05</text>
  </g>
  <!-- Cella BOTTOM-LEFT (letta) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="16" y="412" font-size="17">notifications@github.com</text>
    <text x="16" y="429" font-size="13" fill="#333">[anthropics/claude-code] New issue #1234</text>
    <text x="310" y="412" font-size="17" text-anchor="end">08:15</text>
    <text x="310" y="429" font-size="17" text-anchor="end">12/05</text>
  </g>
  <!-- Cella TOP-RIGHT (UNREAD) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="326" y="337" font-size="17">ordini@amazon.it</text>
    <use href="#mailIcon" transform="translate(457,323)"/>
    <text x="326" y="354" font-size="13" fill="#333">Il tuo ordine e' in arrivo: consegna oggi</text>
    <text x="620" y="337" font-size="17" text-anchor="end">07:30</text>
    <text x="620" y="354" font-size="17" text-anchor="end">11/05</text>
  </g>
  <!-- Cella BOTTOM-RIGHT (letta) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="326" y="412" font-size="17">newsletter@tech.com</text>
    <text x="326" y="429" font-size="13" fill="#333">5 trend ESP32 da seguire nel 2026</text>
    <text x="620" y="412" font-size="17" text-anchor="end">22:10</text>
    <text x="620" y="429" font-size="17" text-anchor="end">10/05</text>
  </g>

  <!-- ====== Sidebar bianca x=620..960, y=0..460 ====== -->
  <line x1="630" y1="14" x2="630" y2="474" stroke="#bbbbbb" stroke-dasharray="3,3"/>

  <!-- ====== Calendario fieldset 320w x 200h @ (x=630, y=10) ====== -->
  <!-- Bordo arrotondato con interruzione per titolo "Maggio" -->
  <path d="M 654 24 L 640 24 A 14 14 0 0 0 626 38 L 626 210 A 14 14 0 0 0 640 224 L 936 224 A 14 14 0 0 0 950 210 L 950 38 A 14 14 0 0 0 936 24 L 715 24"
        fill="none" stroke="#000000" stroke-width="1"/>
  <text x="685" y="29" text-anchor="middle" font-size="16">Maggio</text>

  <!-- Header giorni settimana L M M G V S D -->
  <g font-size="13" text-anchor="middle">
    <text x="660" y="49">L</text>
    <text x="703" y="49">M</text>
    <text x="745" y="49">M</text>
    <text x="788" y="49">G</text>
    <text x="831" y="49">V</text>
    <text x="873" y="49">S</text>
    <text x="916" y="49">D</text>
  </g>
  <line x1="638" y1="55" x2="938" y2="55" stroke="#000000" stroke-width="0.7"/>

  <!-- Griglia mese maggio 2026 (1 maggio = venerdi) - oggi=5 (martedi) -->
  <g font-size="13" text-anchor="middle">
    <!-- Riga 1: 1=ven, 2=sab, 3=dom (lun-mer vuoti) -->
    <text x="831" y="78">1</text>
    <text x="873" y="78">2</text>
    <text x="916" y="78">3</text>
    <!-- Riga 2: 4=lun, 5=mar (today rosso), 6,7,8,9,10 -->
    <text x="660" y="105">4</text>
    <rect x="688" y="89" width="30" height="22" rx="4" fill="#d7263d"/>
    <text x="703" y="105" fill="#ffffff">5</text>
    <text x="745" y="105">6</text>
    <text x="788" y="105">7</text>
    <text x="831" y="105">8</text>
    <text x="873" y="105">9</text>
    <text x="916" y="105">10</text>
    <!-- Riga 3 -->
    <text x="660" y="132">11</text>
    <text x="703" y="132">12</text>
    <text x="745" y="132">13</text>
    <text x="788" y="132">14</text>
    <text x="831" y="132">15</text>
    <text x="873" y="132">16</text>
    <text x="916" y="132">17</text>
    <!-- Riga 4 -->
    <text x="660" y="158">18</text>
    <text x="703" y="158">19</text>
    <text x="745" y="158">20</text>
    <text x="788" y="158">21</text>
    <text x="831" y="158">22</text>
    <text x="873" y="158">23</text>
    <text x="916" y="158">24</text>
    <!-- Riga 5 -->
    <text x="660" y="184">25</text>
    <text x="703" y="184">26</text>
    <text x="745" y="184">27</text>
    <text x="788" y="184">28</text>
    <text x="831" y="184">29</text>
    <text x="873" y="184">30</text>
    <text x="916" y="184">31</text>
  </g>

  <!-- ====== Lista eventi 320w x 230h @ (x=630, y=220) ======
       MAX_EVENTS_DISPLAYED viene da una cascata 7->6->5 con soglia
       MIN_EVT_ROW_H = 45: su EVT_H = 230 solo 230/5 = 46 la supera, quindi
       5 righe da EVT_ROW_H = 46. rowTop = EVT_Y + row*46 -> 220/266/312/358/404
       (display) = 234/280/326/372/418 qui. Baseline dentro la riga:
         time  rowTop + 19
         title rowTop + EVT_ROW_H/2 + 6 = rowTop + 29
         date  rowTop + EVT_ROW_H - 7   = rowTop + 39
       Tutti e tre in FONT_BODY, nessuno in grassetto. Titolo a
       EVT_X + EVT_PAD_LEFT = 633 -> 643; time/date allineati a destra a
       EVT_X + EVT_W - EVT_PAD = 942 -> 952. Separatore drawFastHLine al top
       di ogni riga tranne la prima, inset EVT_SEP_PAD = 15 px per lato.
       Gli eventi di oggi sono interamente rossi. -->
  <g font-size="17">
    <!-- evt 1 oggi (rosso) -->
    <text x="643" y="263" fill="#d7263d">Standup team backend</text>
    <text x="952" y="253" text-anchor="end" fill="#d7263d">10:00</text>
    <text x="952" y="273" text-anchor="end" fill="#d7263d">05/05</text>
    <line x1="655" y1="280" x2="945" y2="280" stroke="#000000" stroke-width="1"/>
    <!-- evt 2 oggi (rosso) -->
    <text x="643" y="309" fill="#d7263d">Call fornitore SOLUM</text>
    <text x="952" y="299" text-anchor="end" fill="#d7263d">15:30</text>
    <text x="952" y="319" text-anchor="end" fill="#d7263d">05/05</text>
    <line x1="655" y1="326" x2="945" y2="326" stroke="#000000" stroke-width="1"/>
    <!-- evt 3 -->
    <text x="643" y="355">Review progetto e-p..</text>
    <text x="952" y="345" text-anchor="end">09:30</text>
    <text x="952" y="365" text-anchor="end">06/05</text>
    <line x1="655" y1="372" x2="945" y2="372" stroke="#000000" stroke-width="1"/>
    <!-- evt 4: all-day -> il posto dell'orario porta "tutto gg" -->
    <text x="643" y="401">Convegno annuale</text>
    <text x="952" y="391" text-anchor="end">tutto gg</text>
    <text x="952" y="411" text-anchor="end">07/05</text>
    <line x1="655" y1="418" x2="945" y2="418" stroke="#000000" stroke-width="1"/>
    <!-- evt 5 -->
    <text x="643" y="447">Intervento Napoli</text>
    <text x="952" y="437" text-anchor="end">08:15</text>
    <text x="952" y="457" text-anchor="end">09/05</text>
  </g>

  <!-- ====== Banner footer 960w x 212h @ (x=0, y=460) ====== -->

  <!-- ====== Indoor fieldset 154w x 202h @ (x=5, y=465) ====== -->
  <path d="M 36 484 L 25 484 A 14 14 0 0 0 15 494 L 15 657 A 14 14 0 0 0 25 667 L 154 667 A 14 14 0 0 0 168 653 L 168 498 A 14 14 0 0 0 154 484 L 81 484"
        fill="none" stroke="#000000" stroke-width="1"/>
  <text x="58" y="489" text-anchor="middle" font-size="15">Indoor</text>

  <!-- 4 righe Indoor: T, RH, IAQ, P (icone semplificate).
       Colonna unica ancorata a col1X = INDOOR_RR_X + INDOOR_COL1_OFFSET = 15
       (display) = 25 qui; il testo parte a col1X + 20 + INDOOR_ICON_GAP 6 = 51.
       Baseline INDOOR_ROW{1..4}_BASELINE = BANNER_Y + 46/92/138/184 =
       506/552/598/644 -> 520/566/612/658 qui. Icona di ogni riga a
       baseline - INDOOR_ICON_SIZE + 6.
       Font: T, RH e P in FONT_LARGE (FreeSans18pt, NON bold); la riga IAQ in
       FONT_SMALL con il pedice accuracy in FONT_MICRO. Solo la temperatura
       e' rossa. -->
  <g font-size="26">
    <!-- Termometro (frame icona a 25,506) -->
    <rect x="32" y="506" width="4" height="13" fill="#000"/>
    <circle cx="34" cy="521" r="4" fill="#000"/>
    <text x="51" y="520" fill="#d7263d">22.5°C</text>
    <!-- Goccia umidita (frame a 25,552) -->
    <path d="M 34 552 L 40 564 A 6 6 0 1 1 28 564 Z" fill="#000"/>
    <text x="51" y="566">45 %</text>
    <!-- Foglia IAQ (frame a 25,598) -->
    <path d="M 34 598 Q 27 606 34 613 Q 41 606 34 598 Z" fill="#000"/>
    <text x="51" y="612" font-size="13">Buona 74<tspan font-size="7" dy="2">3</tspan></text>
    <!-- Tachimetro pressione (frame a 25,644) -->
    <path d="M 28 657 A 7 7 0 0 1 42 657" fill="none" stroke="#000" stroke-width="1.4"/>
    <line x1="28" y1="657" x2="42" y2="657" stroke="#000" stroke-width="1.4"/>
    <line x1="35" y1="657" x2="39" y2="652" stroke="#000" stroke-width="1.4"/>
    <text x="51" y="658">1013 hPa</text>
  </g>

  <!-- ====== Weather fieldset 306w x 202h @ (x=169, y=465) ====== -->
  <path d="M 200 484 L 189 484 A 14 14 0 0 0 179 494 L 179 657 A 14 14 0 0 0 189 667 L 471 667 A 14 14 0 0 0 485 653 L 485 498 A 14 14 0 0 0 471 484 L 251 484"
        fill="none" stroke="#000000" stroke-width="1"/>
  <text x="225" y="489" text-anchor="middle" font-size="15">Weather</text>

  <!-- Blocco meteo corrente (sinistra del riquadro Weather).
       renderBlock centra tutto su blockX + blockW/2: BLOCK_CURRENT_X = 157,
       BLOCK_CURRENT_W = 200 -> centro 257 (display) = 267 qui.
       ICON_SIZE = 88 con top a ICON_Y = BANNER_Y + 6 = 466 -> 480.
       Baseline: DESC +118 = 578 -> 592, TEMP +153 = 613 -> 627,
       TIME +188 = 648 -> 662. Font: desc FONT_BODY, temp FONT_LARGE_BOLD
       (rossa), orario FONT_TIME (= FONT_LARGE sul 097c). -->
  <rect x="223" y="480" width="88" height="88" fill="none" stroke="#bbb" stroke-dasharray="3,3"/>
  <text x="267" y="528" text-anchor="middle" font-size="11" letter-spacing="2" fill="#888">ICON</text>
  <text x="267" y="592" text-anchor="middle" font-size="17">sereno</text>
  <text x="267" y="627" text-anchor="middle" font-size="26" font-weight="700" fill="#d7263d">18°C</text>
  <text x="267" y="662" text-anchor="middle" font-size="26">14:30</text>

  <!-- ====== Sub-col sun (destra del blocco meteo corrente) ======
       Quattro righe centrate su SUN_COL_CENTER_X = 416 (display) = 426 qui,
       essendo l'intero schermo traslato di (+10, +14).
         Row 1 sunrise  baseline SUN_ROW1_BASELINE = BANNER_Y + 46  = 506 -> 520
         Row 2 sunset   baseline SUN_ROW2_BASELINE = BANNER_Y + 70  = 530 -> 544
         Row 3 slider   cella    SUN_ROW3_BASELINE + TRB_CELL_Y_OFFSET = 556 -> 570
         Row 4 chart    top      BANNER_Y + TC_TOP_OFFSET = 576 -> 590
       drawSunRow centra icona+testo insieme: totalW = 20 + GAP 6 + tw,
       startX = centerX - totalW/2, iconY = baseline - 20 + 6. -->
  <g>
    <!-- sunrise (raggi pieni), icona a startX=389, baseline testo 520 -->
    <g transform="translate(389,506)">
      <rect x="0" y="0" width="20" height="1" fill="#000"/>
      <rect x="1" y="2" width="18" height="1" fill="#000"/>
      <rect x="2" y="4" width="16" height="1" fill="#000"/>
      <rect x="3" y="6" width="14" height="1" fill="#000"/>
      <rect x="4" y="8" width="12" height="1" fill="#000"/>
      <rect x="5" y="10" width="10" height="1" fill="#000"/>
      <rect x="6" y="12" width="8" height="1" fill="#000"/>
      <rect x="7" y="14" width="6" height="1" fill="#000"/>
    </g>
    <text x="415" y="520" font-size="17">06:14</text>

    <!-- sunset (semicerchio + linea orizzonte) -->
    <g transform="translate(389,530)">
      <path d="M 3 10 A 7 7 0 0 1 17 10 Z" fill="#000"/>
      <rect x="0" y="11" width="20" height="1" fill="#000"/>
    </g>
    <text x="415" y="544" font-size="17">20:37</text>

    <!-- @widget slider-temp-range: cifre morn/eve, barra e triangolo,
         TUTTO NERO (drawTempRangeBar usa GxEPD_BLACK; questo pannello ha
         due soli piani). Cella TRB_W=112 con origine x = 426 - 50 = 376.
         Geometria come nel C++ con morn=8/eve=12: barLeft=25, barRight=75,
         barra y=+7 spessa 4, triangolo base 11 px dal top cella alla barra,
         cifre baseline a cellY+12, cerchietti gradi sopra il top cella. -->
    <g transform="translate(376,570)">
      <text x="2" y="12" font-size="17">8</text>
      <circle cx="18" cy="-2" r="2" stroke="#000" fill="none"/>
      <rect x="25" y="7" width="50" height="4" fill="#000"/>
      <polygon points="45,0 55,0 50,7" fill="#000"/>
      <text x="79" y="12" font-size="17">12</text>
      <circle cx="107" cy="-2" r="2" stroke="#000" fill="none"/>
    </g>

    <!-- @widget storico-temperature: mini-chart TC_W=112 x TC_H=56 con
         origine (370, 590). Tratto nero = passato (3h di ring buffer),
         tratto rosso = forecast (slot[1..3], ~+9h), pallino nero su "ora".
         Geometria interna: labLeftX=370, chartL=384 (= +TC_LABEL_W),
         chartR=482, axisY=638 (= top + TC_H - TC_AXIS_PAD_BOT),
         plotTop=596, tick TC_TICK_H=2 sotto l'asse, label HH:MM in
         FONT_MICRO a y = axisY + TC_AXIS_PAD_BOT - 1 = 645.
         Il "now" non e' un tick: lo segna solo il pallino. -->
    <g>
      <!-- Label max/min (FONT_MICRO) nella colonna sx riservata -->
      <text x="370" y="600" font-size="6" font-family="monospace">18</text>
      <text x="370" y="637" font-size="6" font-family="monospace">12</text>

      <!-- Curva passato (nera) fino a "ora" (x=408, 3h su 12h di range) -->
      <path d="M 384 623 C 392 618, 400 610, 408 596" fill="none" stroke="#000" stroke-width="1.5"/>
      <!-- Curva forecast (rossa) da "ora" a fine range -->
      <path d="M 408 596 C 430 604, 456 622, 482 637" fill="none" stroke="#d7263d" stroke-width="1.5"/>
      <!-- Pallino TC_DOT_R=3 sulla temperatura corrente -->
      <circle cx="408" cy="596" r="3" fill="#000"/>

      <!-- Asse X + 3 tick (inizio, mediana temporale, fine) -->
      <line x1="384" y1="638" x2="482" y2="638" stroke="#000" stroke-width="1"/>
      <line x1="384" y1="639" x2="384" y2="641" stroke="#000" stroke-width="1"/>
      <line x1="433" y1="639" x2="433" y2="641" stroke="#000" stroke-width="1"/>
      <line x1="481" y1="639" x2="481" y2="641" stroke="#000" stroke-width="1"/>

      <!-- Label HH:MM sotto i tick, estremi con clamp ai bordi del chart -->
      <text x="384" y="645" font-size="6" font-family="monospace" text-anchor="start">11:30</text>
      <text x="433" y="645" font-size="6" font-family="monospace" text-anchor="middle">17:30</text>
      <text x="482" y="645" font-size="6" font-family="monospace" text-anchor="end">23:30</text>
    </g>
  </g>

  <!-- ====== Forecast fieldset 470w x 202h @ (x=485, y=465) ====== -->
  <path d="M 516 484 L 505 484 A 14 14 0 0 0 495 494 L 495 657 A 14 14 0 0 0 505 667 L 951 667 A 14 14 0 0 0 965 653 L 965 498 A 14 14 0 0 0 951 484 L 569 484"
        fill="none" stroke="#000000" stroke-width="1"/>
  <text x="542" y="489" text-anchor="middle" font-size="15">Forecast</text>

  <!-- 3 slot da BLOCK_FC_W = 156 a x = 485 / 641 / 797 (display), quindi
       centri 563 / 719 / 875 -> 573 / 729 / 885 qui. Stesse baseline e
       stessi font del blocco corrente: e' la stessa renderBlock(). -->
  <!-- Slot 1 17:00 -->
  <g>
    <rect x="529" y="480" width="88" height="88" fill="none" stroke="#bbb" stroke-dasharray="3,3"/>
    <text x="573" y="528" text-anchor="middle" font-size="11" letter-spacing="2" fill="#888">ICON</text>
    <text x="573" y="592" text-anchor="middle" font-size="17">poco nuvoloso</text>
    <text x="573" y="627" text-anchor="middle" font-size="26" font-weight="700" fill="#d7263d">17°C</text>
    <text x="573" y="662" text-anchor="middle" font-size="26">17:00</text>
  </g>
  <!-- Slot 2 20:00 - composeDescLine sostituisce la descrizione testuale
       con i valori quantitativi quando e' prevista pioggia -->
  <g>
    <rect x="685" y="480" width="88" height="88" fill="none" stroke="#bbb" stroke-dasharray="3,3"/>
    <text x="729" y="528" text-anchor="middle" font-size="11" letter-spacing="2" fill="#888">ICON</text>
    <text x="729" y="592" text-anchor="middle" font-size="17">80% 0.5mm</text>
    <text x="729" y="627" text-anchor="middle" font-size="26" font-weight="700" fill="#d7263d">15°C</text>
    <text x="729" y="662" text-anchor="middle" font-size="26">20:00</text>
  </g>
  <!-- Slot 3 23:00 -->
  <g>
    <rect x="841" y="480" width="88" height="88" fill="none" stroke="#bbb" stroke-dasharray="3,3"/>
    <text x="885" y="528" text-anchor="middle" font-size="11" letter-spacing="2" fill="#888">ICON</text>
    <text x="885" y="592" text-anchor="middle" font-size="17">nubi sparse</text>
    <text x="885" y="627" text-anchor="middle" font-size="26" font-weight="700" fill="#d7263d">13°C</text>
    <text x="885" y="662" text-anchor="middle" font-size="26">23:00</text>
  </g>
</svg>
